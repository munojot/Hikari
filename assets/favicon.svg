<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hikariRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle Background with Red Gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#hikariRedGrad)" />
  
  <!-- Subtle Outer Light Ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldSunGrad)" stroke-width="3" stroke-dasharray="14 8" stroke-opacity="0.4" />

  <!-- Radiating Subtle Hikari Rays -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="4">
    <line x1="256" y1="20" x2="256" y2="70" />
    <line x1="256" y1="442" x2="256" y2="492" />
    <line x1="20" y1="256" x2="70" y2="256" />
    <line x1="442" y1="256" x2="492" y2="256" />
    <line x1="89" y1="89" x2="125" y2="125" />
    <line x1="387" y1="387" x2="423" y2="423" />
    <line x1="89" y1="423" x2="125" y2="387" />
    <line x1="387" y1="125" x2="423" y2="89" />
  </g>

  <!-- Sakura Petal Accent at Top Right -->
  <path d="M380 120 C365 95 390 75 410 90 C430 105 405 135 380 120 Z" fill="#FDA4AF" opacity="0.85" />
  <path d="M400 135 C390 120 405 105 418 115 C430 125 412 145 400 135 Z" fill="#FFE4E6" opacity="0.75" />

  <!-- Bold Kanji: 光 (Hikari - Light) -->
  <text 
    x="256" 
    y="350" 
    text-anchor="middle" 
    font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'MS PGothic', sans-serif" 
    font-size="280" 
    font-weight="900" 
    fill="#FFFFFF"
    style="text-shadow: 0 4px 12px rgba(0,0,0,0.3);"
  >光</text>

  <!-- Inner Sparkle Highlight -->
  <circle cx="210" cy="180" r="8" fill="#FFFFFF" opacity="0.8" />
</svg>
